<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tebex Store Packages</title>

    <style>
        /* --- CSS Styles --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        header, footer {
            text-align: center;
            color: #555;
            margin-bottom: 20px;
        }

        h1 {
            color: #1a1a1a;
        }

        #package-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        #loading-message, .error-message {
            text-align: center;
            font-size: 1.2em;
            color: #888;
        }

        .error-message {
            color: #d9534f;
        }

        .category {
            background-color: #ffffff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }

        .category h2 {
            margin-top: 0;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .package-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            background-color: #fafafa;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .package-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        .package-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background-color: #e0e0e0;
        }

        .package-content {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .package-content h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .package-content .description {
            font-size: 0.9em;
            color: #666;
            flex-grow: 1;
            margin-bottom: 15px;
        }

        .package-content .price {
            font-size: 1.2em;
            font-weight: bold;
            color: #28a745;
            text-align: right;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Tebex Store Packages (djontop.tebex.io)</h1>
    </header>
    
    <main id="package-container">
        <p id="loading-message">Loading packages from Tebex...</p>
        </main>

    <footer>
        <p>Dashboard generated on: <span id="current-date"></span></p>
    </footer>

    <script>
        /* --- JavaScript Logic --- */
        document.addEventListener('DOMContentLoaded', () => {

            // --- CONFIGURATION ---
            // 🚨 PASTE YOUR TEBEX SECRET KEY HERE
            // This key is visible to anyone viewing your webpage source.
            // This file is safe for LOCAL USE on your computer, but DO NOT make it public.
            const TEBEX_SECRET_KEY = "ded82d9fe34bf957257ea150d6ad934220e1ccc7";

            const API_URL = "https://headless.tebex.io/api/listing";

            // --- DOM ELEMENTS ---
            const packageContainer = document.getElementById('package-container');
            const loadingMessage = document.getElementById('loading-message');
            const currentDateEl = document.getElementById('current-date');
            
            // Set current date in the footer
            currentDateEl.textContent = new Date().toLocaleString();

            // --- MAIN FUNCTION ---
            async function fetchAndDisplayPackages() {
                if (TEBEX_SECRET_KEY === "YOUR_TEBEX_SECRET_KEY") {
                    displayError("Please set your TEBEX_SECRET_KEY inside the <script> tag in this HTML file.");
                    return;
                }

                try {
                    const response = await fetch(API_URL, {
                        headers: {
                            'X-Tebex-Secret': TEBEX_SECRET_KEY
                        }
                    });

                    if (!response.ok) {
                        throw new Error(`Tebex API responded with status: ${response.status}. Check your Secret Key.`);
                    }

                    const data = await response.json();
                    displayPackages(data);

                } catch (error) {
                    console.error("Failed to fetch packages:", error);
                    displayError(error.message);
                } finally {
                    if (loadingMessage) {
                        loadingMessage.style.display = 'none';
                    }
                }
            }

            function displayPackages(data) {
                packageContainer.innerHTML = ''; // Clear loading message

                if (!data.categories || data.categories.length === 0) {
                    packageContainer.innerHTML = '<p>No categories or packages found.</p>';
                    return;
                }

                const currencySymbol = data.meta.currency.symbol;

                data.categories.forEach(category => {
                    const categoryDiv = document.createElement('div');
                    categoryDiv.className = 'category';

                    let packagesHTML = '';
                    category.packages.forEach(pkg => {
                        // Sanitize description by letting the browser parse it and then taking the text content
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = pkg.description;
                        const sanitizedDescription = tempDiv.textContent || "No description available.";
                        
                        packagesHTML += `
                            <div class="package-card">
                                ${pkg.image ? `<img src="${pkg.image}" alt="${pkg.name}">` : '<div style="height: 150px; background-color: #eee;" title="No image available"></div>'}
                                <div class="package-content">
                                    <h3>${pkg.name}</h3>
                                    <div class="description">${sanitizedDescription}</div>
                                    <div class="price">${currencySymbol}${pkg.total_price}</div>
                                </div>
                            </div>
                        `;
                    });

                    categoryDiv.innerHTML = `
                        <h2>${category.name}</h2>
                        <div class="packages-grid">
                            ${packagesHTML}
                        </div>
                    `;
                    packageContainer.appendChild(categoryDiv);
                });
            }

            function displayError(message) {
                packageContainer.innerHTML = `<p class="error-message"><strong>Error:</strong> ${message}</p>`;
            }

            // --- INITIALIZE ---
            fetchAndDisplayPackages();
        });
    </script>
</body>
</html>
